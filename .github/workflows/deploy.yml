name: Deploy to Cloudways

# Every push to master asks Cloudways to pull the repository into public_html.
# Needs two repository secrets: CLOUDWAYS_EMAIL and CLOUDWAYS_API_KEY
# (Cloudways panel -> account menu -> API).  Server and app ids come from the
# application's cloudwaysapps.com hostname: phpstack-<server>-<app>.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudways to pull the latest commit
        env:
          CLOUDWAYS_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
          CLOUDWAYS_API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
          SERVER_ID: "747420"
          APP_ID: "6673858"
          GIT_URL: "git@github.com:JuicyNinja/tad-johana-wedding.git"
        run: |
          set -e
          if [ -z "$CLOUDWAYS_EMAIL" ] || [ -z "$CLOUDWAYS_API_KEY" ]; then
            echo "Add the CLOUDWAYS_EMAIL and CLOUDWAYS_API_KEY secrets in GitHub (Settings -> Secrets and variables -> Actions)."; exit 1; fi
          TOKEN=$(curl -sS -X POST https://api.cloudways.com/api/v1/oauth/access_token \
            -d "email=$CLOUDWAYS_EMAIL" -d "api_key=$CLOUDWAYS_API_KEY" | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -sS -X POST https://api.cloudways.com/api/v1/git/pull \
            -H "Authorization: Bearer $TOKEN" \
            -d "server_id=$SERVER_ID" -d "app_id=$APP_ID" \
            -d "git_url=$GIT_URL" -d "branch_name=master" -d "deploy_path=public_html" \
            | tee response.json
          python3 - <<'PY'
          import json
          r = json.load(open('response.json'))
          print(r)
          assert r.get('status') in (True, 'true', 1) or 'operation_id' in r, 'Cloudways did not accept the pull'
          PY
