name: Deploy to Cloudways

# Every push to master asks Cloudways to pull the repository into the application.
# Needs two repository secrets: CLOUDWAYS_EMAIL and CLOUDWAYS_API_KEY
# (Cloudways panel -> account menu -> API).  Server and app ids come from the
# application's cloudwaysapps.com hostname: phpstack-<server>-<app>.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudways to pull the latest commit
        env:
          CLOUDWAYS_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
          CLOUDWAYS_API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
          SERVER_ID: "747420"
          APP_ID: "6673858"
          GIT_URL: "git@github.com:JuicyNinja/tad-johana-wedding.git"
        run: |
          if [ -z "$CLOUDWAYS_EMAIL" ] || [ -z "$CLOUDWAYS_API_KEY" ]; then
            echo "::error::Secrets missing. Add CLOUDWAYS_EMAIL and CLOUDWAYS_API_KEY under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Email secret length: ${#CLOUDWAYS_EMAIL}, key length: ${#CLOUDWAYS_API_KEY}"

          echo "== 1. Sign in to the Cloudways API =="
          AUTH=$(curl -sS -w '\nHTTP %{http_code}' -X POST https://api.cloudways.com/api/v1/oauth/access_token \
            --data-urlencode "email=$CLOUDWAYS_EMAIL" --data-urlencode "api_key=$CLOUDWAYS_API_KEY")
          echo "$AUTH" | sed -E 's/"access_token":"[^"]+"/"access_token":"(hidden)"/'
          TOKEN=$(echo "$AUTH" | head -1 | python3 -c 'import sys,json
          try:
              print(json.load(sys.stdin).get("access_token",""))
          except Exception:
              print("")')
          if [ -z "$TOKEN" ]; then
            echo "::error::Cloudways rejected the sign-in. Check that CLOUDWAYS_EMAIL is the Cloudways login email and CLOUDWAYS_API_KEY is the key from the API page."
            exit 1
          fi

          echo "== 2. Ask for a git pull =="
          RESP=$(curl -sS -w '\nHTTP %{http_code}' -X POST https://api.cloudways.com/api/v1/git/pull \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "server_id=$SERVER_ID" --data-urlencode "app_id=$APP_ID" \
            --data-urlencode "git_url=$GIT_URL" --data-urlencode "branch_name=master" --data-urlencode "deploy_path=")
          echo "$RESP"
          CODE=$(echo "$RESP" | tail -1 | sed 's/HTTP //')
          if [ "$CODE" != "200" ]; then
            echo "::error::Cloudways answered HTTP $CODE to the pull request. The body above says why."
            exit 1
          fi
          echo "Pull requested. Cloudways runs it in the background; the site updates within a minute."
