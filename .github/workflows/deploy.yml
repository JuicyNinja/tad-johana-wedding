name: Deploy to Cloudways

# Every push to master uploads the site to the Cloudways application over SFTP.
# Needs three repository secrets (GitHub: Settings -> Secrets and variables -> Actions):
#   SFTP_HOST      the server's public IP (Cloudways: application -> Access Details)
#   SFTP_USER      an application credential username (Access Details -> Application Credentials)
#   SFTP_PASSWORD  that credential's password
# Application credentials log straight into the application folder, so "public_html/" is the site root.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are present
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing. Add it under Settings -> Secrets and variables -> Actions."; exit 1; fi
          done
          echo "Secrets present (host length ${#SFTP_HOST}, user length ${#SFTP_USER})."

      - name: Get the site files
        uses: actions/checkout@v4

      - name: Upload to the application's public_html over SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: sftp
          port: 22
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local-dir: ./
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .gitignore
